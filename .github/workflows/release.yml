name: Release

on:
  pull_request:
  push:
    branches: [dev, main]
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: gui
      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"
      - run: npm run check && npm run test && npm run build
        working-directory: gui
      - run: cargo test --locked
        working-directory: gui/src-tauri

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            args: ''
            rust_target: ''
          - platform: windows-latest
            runner: windows-latest
            args: ''
            rust_target: ''
          - platform: macos-aarch64
            runner: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: macos-x86_64
            runner: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          tagName: ${{ github.ref_name }}
          releaseName: Eden Cheats Manager ${{ github.ref_name }}
          releaseBody: |
            See the assets below to download for your platform.

            Release notes, setup and known limitations: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md

            **Windows/macOS:** Builds are not yet runtime-verified for this RC. Desktop installers are not publisher-signed/notarized; review platform security warnings before choosing to install.
            **Linux:** AppImage — make executable with `chmod +x` then run.
            **Android:** Sideload the APK — enable "Install from unknown sources" in settings.
            Back up existing cheats/settings before testing. Do not uninstall an existing Android release to bypass a signing mismatch.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }} -- --locked

  release-android:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"

          PINNED_ANDROID_SDK="$RUNNER_TEMP/android-sdk-ndk27"
          mkdir -p "$PINNED_ANDROID_SDK/ndk"
          for SDK_DIR in build-tools cmdline-tools licenses platform-tools platforms; do
            ln -s "$ANDROID_SDK_ROOT/$SDK_DIR" "$PINNED_ANDROID_SDK/$SDK_DIR"
          done
          ln -s "$ANDROID_SDK_ROOT/ndk/27.2.12479018" "$PINNED_ANDROID_SDK/ndk/27.2.12479018"

          {
            echo "ANDROID_HOME=$PINNED_ANDROID_SDK"
            echo "ANDROID_SDK_ROOT=$PINNED_ANDROID_SDK"
            echo "NDK_HOME=$PINNED_ANDROID_SDK/ndk/27.2.12479018"
          } >> "$GITHUB_ENV"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build Android APK (release)
        working-directory: gui
        run: npm run tauri android build -- --apk -- --locked

      - name: Verify JNI methods not renamed by R8
        run: |
          APK=gui/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          APKANALYZER=$(find -L "$ANDROID_SDK_ROOT/cmdline-tools" -name apkanalyzer 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKANALYZER" ]; then
            echo "ERROR: apkanalyzer not found; release verification is mandatory"
            exit 1
          fi
          METHODS='selectEdenLoadDirectory()V getEdenLoadAccessStatus()Ljava/lang/String; safListDirectory(Ljava/lang/String;)Ljava/lang/String; safWriteTextFile(Ljava/lang/String;Ljava/lang/String;)Ljava/lang/String; safDeleteFile(Ljava/lang/String;)Ljava/lang/String; safRemoveEmptyDirectory(Ljava/lang/String;)Ljava/lang/String; selectProdKeysDocument()V selectGamePackageDocument()V getPackageDiscoveryStatus()Ljava/lang/String; openProdKeysReadFd()I openGamePackageReadFd()I selectGameLibraryDirectory()V getGameLibraryStatus()Ljava/lang/String; listGameLibraryPackages()Ljava/lang/String; openGameLibraryPackageReadFd(Ljava/lang/String;)I'
          FAIL=0
          DEX_DUMP=$("$APKANALYZER" dex code --class dev.eden.cheats_manager.MainActivity "$APK")
          DECLARATIONS=$(echo "$DEX_DUMP" | grep -E '^\.method .*public.*static ' | sed 's/.* //')
          for M in $METHODS; do
            if ! echo "$DECLARATIONS" | grep -Fxq "$M"; then
              echo "ERROR: method '$M' missing from APK dex — R8 renamed or removed it"
              FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] && echo "All JNI-called methods present in dex" || exit 1

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/ecm-release-keystore.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          APKSIGNER=$(find -L "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out eden-cheats-manager.apk \
            gui/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs eden-cheats-manager.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: eden-cheats-manager.apk
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  checksums:
    needs: [release, release-android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Attach checksums after all platform builds succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ARTIFACT_DIR=$(mktemp -d)
          gh release download "$RELEASE_TAG" --dir "$ARTIFACT_DIR"
          cd "$ARTIFACT_DIR"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
