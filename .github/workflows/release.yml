name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            args: ''
            rust_target: ''
          - platform: windows-latest
            runner: windows-latest
            args: ''
            rust_target: ''
          - platform: macos-aarch64
            runner: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: macos-x86_64
            runner: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: gui
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          tagName: ${{ github.ref_name }}
          releaseName: Eden Cheats Manager ${{ github.ref_name }}
          releaseBody: |
            See the assets below to download for your platform.

            **Windows:** If SmartScreen blocks the installer, click "More info" → "Run anyway".
            **Linux:** AppImage — make executable with `chmod +x` then run.
            **macOS:** Unsigned. Right-click the app → Open to bypass Gatekeeper.
            **Android:** Sideload the APK — enable "Install from unknown sources" in settings.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        working-directory: gui
        run: npm install

      - name: Build Android APK (release)
        working-directory: gui
        run: npm run tauri android build -- --apk
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018

      - name: Verify JNI methods not renamed by R8
        run: |
          APK=gui/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          APKANALYZER=$(find $ANDROID_SDK_ROOT/cmdline-tools -name apkanalyzer 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKANALYZER" ]; then
            echo "apkanalyzer not found, skipping method check"
            exit 0
          fi
          METHODS="selectEdenLoadDirectory safListDirectory safWriteTextFile safDeleteFile safRemoveEmptyDirectory launchIntent returnToApp startScanService stopScanService"
          FAIL=0
          DEX_DUMP=$($APKANALYZER dex packages --defined-only "$APK" 2>/dev/null)
          for M in $METHODS; do
            if ! echo "$DEX_DUMP" | grep -q "$M"; then
              echo "ERROR: method '$M' missing from APK dex — R8 renamed or removed it"
              FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] && echo "All JNI-called methods present in dex" || exit 1

      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > keystore.jks
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -1)
          $APKSIGNER sign \
            --ks keystore.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.ANDROID_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out eden-cheats-manager.apk \
            gui/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: eden-cheats-manager.apk
          draft: true
